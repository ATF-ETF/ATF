name: ATF checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install core test dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'numpy>=2.0,<3'
      - name: Validate Python sources
        run: python -m compileall -q atf app.py tests
      - name: Run offline data contract tests
        run: python -m unittest discover -s tests -v
      - name: Exercise demo CLI
        run: python -m atf.cli --demo --start 2026-08-03 --end 2026-10-30 --output /tmp/atf-demo
